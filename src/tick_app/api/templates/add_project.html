{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="card-header">
    <h2 class="card-title">Add Project</h2>
  </div>

  <form action="/projects/add" method="post">
    <div class="form-group">
      <label for="name" class="form-label">Project Name</label>
      <input type="text" class="form-control" id="name" name="name" required placeholder="Enter project name">
    </div>

    <div class="form-group">
      <label for="parent_id" class="form-label">Parent Project (Optional)</label>
      <select class="form-select form-control" id="parent_id" name="parent_id">
        <option value="">None</option>
        {% for project in projects %}
        <option value="{{ project.id }}">{{ project.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="flex gap-2">
      <a href="/projects" class="btn btn-secondary" style="flex: 1;">Cancel</a>
      <button type="submit" class="btn btn-primary" style="flex: 1;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Add Project
      </button>
    </div>
  </form>
</div>
{% endblock %}
