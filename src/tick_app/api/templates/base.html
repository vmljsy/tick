<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tick - Time Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Premium Dark Theme Palette */
        --bg-body: #0f172a;
        --bg-card: #1e293b;
        --bg-input: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-primary: #3b82f6; /* Blue 500 */
        --accent-hover: #2563eb; /* Blue 600 */
        --accent-success: #10b981; /* Emerald 500 */
        --accent-danger: #ef4444; /* Red 500 */
        --accent-warning: #f59e0b; /* Amber 500 */
        --border-color: #334155;
        
        --font-family: 'Inter', sans-serif;
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        
        --transition: all 0.2s ease-in-out;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--bg-body);
        color: var(--text-primary);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--accent-primary);
        text-decoration: none;
        transition: var(--transition);
      }

      a:hover {
        color: var(--accent-hover);
      }

      /* Layout */
      .navbar {
        background-color: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 1rem 0;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }

      .nav-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.025em;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      
      .brand span {
          color: var(--accent-primary);
      }

      .nav-links {
        display: flex;
        gap: 2rem;
        list-style: none;
      }

      .nav-link {
        color: var(--text-secondary);
        font-weight: 500;
        font-size: 0.95rem;
        padding: 0.5rem 0;
        position: relative;
      }

      .nav-link:hover, .nav-link.active {
        color: var(--text-primary);
      }
      
      .nav-link.active::after {
          content: '';
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 2px;
          background-color: var(--accent-primary);
          border-radius: 2px;
      }

      .main-content {
        padding: 2rem 0;
        min-height: calc(100vh - 80px);
      }

      /* Components */
      .card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        box-shadow: var(--shadow-md);
        margin-bottom: 1.5rem;
      }
      
      .card-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1.5rem;
      }
      
      .card-title {
          font-size: 1.25rem;
          font-weight: 600;
          color: var(--text-primary);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 1rem;
        border-radius: var(--radius-md);
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        border: none;
        font-size: 0.95rem;
        gap: 0.5rem;
      }

      .btn-primary {
        background-color: var(--accent-primary);
        color: white;
      }

      .btn-primary:hover {
        background-color: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }
      
      .btn-secondary {
          background-color: var(--bg-input);
          color: var(--text-primary);
      }
      
      .btn-secondary:hover {
          background-color: #475569;
      }
      
      .btn-danger {
          background-color: rgba(239, 68, 68, 0.1);
          color: var(--accent-danger);
      }
      
      .btn-danger:hover {
          background-color: rgba(239, 68, 68, 0.2);
      }
      
      .btn-sm {
          padding: 0.25rem 0.75rem;
          font-size: 0.875rem;
      }

      /* Forms */
      .form-group {
        margin-bottom: 1rem;
      }

      .form-label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-secondary);
        font-size: 0.9rem;
        font-weight: 500;
      }

      .form-control {
        width: 100%;
        padding: 0.625rem 1rem;
        background-color: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-family: var(--font-family);
        font-size: 0.95rem;
        transition: var(--transition);
      }

      .form-control:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }
      
      .form-select {
          appearance: none;
          background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
          background-position: right 0.5rem center;
          background-repeat: no-repeat;
          background-size: 1.5em 1.5em;
      }

      /* Tables */
      .table-container {
        overflow-x: auto;
      }
      
      .table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .table th {
        padding: 1rem;
        font-weight: 600;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border-color);
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-primary);
      }
      
      .table tr:last-child td {
          border-bottom: none;
      }
      
      .table tr:hover td {
          background-color: rgba(255, 255, 255, 0.02);
      }

      /* Utilities */
      .text-muted { color: var(--text-secondary); }
      .text-success { color: var(--accent-success); }
      .text-danger { color: var(--accent-danger); }
      .text-warning { color: var(--accent-warning); }
      
      .badge {
          display: inline-block;
          padding: 0.25rem 0.5rem;
          border-radius: var(--radius-sm);
          font-size: 0.75rem;
          font-weight: 600;
          text-transform: uppercase;
      }
      
      .badge-primary { background-color: rgba(59, 130, 246, 0.1); color: var(--accent-primary); }
      .badge-success { background-color: rgba(16, 185, 129, 0.1); color: var(--accent-success); }
      .badge-warning { background-color: rgba(245, 158, 11, 0.1); color: var(--accent-warning); }

      .flex { display: flex; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .gap-2 { gap: 0.5rem; }
      .gap-4 { gap: 1rem; }
      .mt-4 { margin-top: 1rem; }
      .mb-4 { margin-bottom: 1rem; }
      
      /* Animations */
      @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in {
          animation: fadeIn 0.4s ease-out forwards;
      }
      
      /* Grid */
      .grid {
          display: grid;
          gap: 1.5rem;
      }
      
      .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
      
      @media (min-width: 768px) {
          .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-content">
        <a class="brand" href="/">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            Tick
        </a>
        <ul class="nav-links">
          <li><a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">Dashboard</a></li>
          <li><a class="nav-link {% if request.url.path.startswith('/logs') %}active{% endif %}" href="/logs">Logs</a></li>
          <li><a class="nav-link {% if request.url.path.startswith('/projects') %}active{% endif %}" href="/projects">Projects</a></li>
          <li><a class="nav-link {% if request.url.path.startswith('/reports') %}active{% endif %}" href="/reports">Reports</a></li>
        </ul>
      </div>
    </nav>

    <div class="container main-content">
      {% block content %}{% endblock %}
    </div>
    
    <script>
        // Simple script to handle active states if needed dynamically, 
        // though Jinja template logic above handles the basics.
    </script>
  </body>
</html>
