{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title">Log Manual Time</h2>
    </div>

    <form action="/log-time" method="post">
        <div class="form-group">
            <label for="project_id" class="form-label">Project</label>
            <select class="form-select form-control" id="project_id" name="project_id" required>
                {% for project in projects %}
                <option value="{{ project.id }}">{{ project.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control" id="description" name="description"
                placeholder="What did you work on?">
        </div>

        <div class="form-group">
            <label for="tags" class="form-label">Tags (comma separated)</label>
            <input type="text" class="form-control" id="tags" name="tags" placeholder="e.g. coding, meeting">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label class="form-label">Time Input Method</label>
            <div class="flex gap-2 mb-4">
                <button type="button" class="btn btn-secondary" onclick="showDuration()"
                    id="btn-duration">Duration</button>
                <button type="button" class="btn btn-secondary" onclick="showTimes()" id="btn-times">Start/End
                    Times</button>
            </div>
        </div>

        <div id="duration-input">
            <div class="form-group">
                <label for="duration" class="form-label">Duration (e.g., "1h 30m" or "90m")</label>
                <input type="text" class="form-control" id="duration" name="duration" placeholder="1h 30m">
            </div>
        </div>

        <div id="times-input" style="display: none;">
            <div class="form-group">
                <label for="start_time" class="form-label">Start Time</label>
                <input type="datetime-local" class="form-control" id="start_time" name="start_time">
            </div>

            <div class="form-group">
                <label for="end_time" class="form-label">End Time</label>
                <input type="datetime-local" class="form-control" id="end_time" name="end_time">
            </div>
        </div>

        <div class="flex gap-2">
            <a href="/" class="btn btn-secondary" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="flex: 1;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Log Time
            </button>
        </div>
    </form>
</div>

<script>
    function showDuration() {
        document.getElementById('duration-input').style.display = 'block';
        document.getElementById('times-input').style.display = 'none';
        document.getElementById('btn-duration').classList.add('btn-primary');
        document.getElementById('btn-duration').classList.remove('btn-secondary');
        document.getElementById('btn-times').classList.add('btn-secondary');
        document.getElementById('btn-times').classList.remove('btn-primary');
        // Clear times inputs
        document.getElementById('start_time').value = '';
        document.getElementById('end_time').value = '';
    }

    function showTimes() {
        document.getElementById('duration-input').style.display = 'none';
        document.getElementById('times-input').style.display = 'block';
        document.getElementById('btn-times').classList.add('btn-primary');
        document.getElementById('btn-times').classList.remove('btn-secondary');
        document.getElementById('btn-duration').classList.add('btn-secondary');
        document.getElementById('btn-duration').classList.remove('btn-primary');
        // Clear duration input
        document.getElementById('duration').value = '';
    }

    // Initialize with duration shown
    showDuration();
</script>
{% endblock %}
