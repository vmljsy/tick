{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Projects</h2>
  <a href="/projects/add" class="btn btn-primary">Add Project</a>
</div>
<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Parent</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for project in projects %}
      <tr>
        <td>{{ project.name }}</td>
        <td>{{ project.parent.name if project.parent else "" }}</td>
        <td>
          <a href="/projects/edit/{{ project.id }}" class="btn btn-sm btn-secondary">Edit</a>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
