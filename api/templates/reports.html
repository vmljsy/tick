{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Time Reports</h2>

    <div class="card mb-4">
        <div class="card-header">Report Filters</div>
        <div class="card-body">
            <form id="report-filter-form">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="start_date" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="start_date" name="start_date">
                    </div>
                    <div class="col-md-6">
                        <label for="end_date" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="end_date" name="end_date">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="project_name" class="form-label">Project Name</label>
                        <input type="text" class="form-control" id="project_name" name="project_name" placeholder="Filter by project">
                    </div>
                    <div class="col-md-6">
                        <label for="tag_name" class="form-label">Tag Name</label>
                        <input type="text" class="form-control" id="tag_name" name="tag_name" placeholder="Filter by tag">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="group_by" class="form-label">Group By</label>
                        <select class="form-select" id="group_by" name="group_by">
                            <option value="project" selected>Project</option>
                            <option value="day">Day</option>
                            <!-- <option value="tag">Tag</option> -->
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="preset_date_range" class="form-label">Preset Range</label>
                        <select class="form-select" id="preset_date_range">
                            <option value="none">Custom Range</option>
                            <option value="today">Today</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                            <option value="year">This Year</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Generate Report</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Report Results</div>
        <div class="card-body">
            <div id="report-results-container">
                <p class="text-muted">Generate a report to see results here.</p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('report-filter-form');
        const presetDateRange = document.getElementById('preset_date_range');
        const startDateInput = document.getElementById('start_date');
        const endDateInput = document.getElementById('end_date');
        const reportResultsContainer = document.getElementById('report-results-container');

        // Function to set date inputs based on preset
        function setDateInputs(preset) {
            const today = new Date();
            let start, end;

            switch (preset) {
                case 'today':
                    start = end = today;
                    break;
                case 'yesterday':
                    start = end = new Date(today);
                    start.setDate(today.getDate() - 1);
                    end.setDate(today.getDate() - 1);
                    break;
                case 'week':
                    start = new Date(today);
                    start.setDate(today.getDate() - today.getDay()); // Sunday
                    end = today;
                    break;
                case 'month':
                    start = new Date(today.getFullYear(), today.getMonth(), 1);
                    end = today;
                    break;
                case 'year':
                    start = new Date(today.getFullYear(), 0, 1);
                    end = today;
                    break;
                default: // Custom Range or None
                    startDateInput.value = '';
                    endDateInput.value = '';
                    return;
            }

            startDateInput.value = start.toISOString().split('T')[0];
            endDateInput.value = end.toISOString().split('T')[0];
        }

        // Event listener for preset date range changes
        presetDateRange.addEventListener('change', function() {
            setDateInputs(this.value);
        });

        // Function to fetch and display report
        async function generateReport(event) {
            event.preventDefault();

            const formData = new FormData(form);
            const params = new URLSearchParams();

            // Add all form fields to params
            for (const [key, value] of formData.entries()) {
                if (value) { // Only add if value is not empty
                    params.append(key, value);
                }
            }

            // Handle preset date range flags
            const selectedPreset = presetDateRange.value;
            if (selectedPreset !== 'none') {
                params.append(selectedPreset, 'true');
                // Remove explicit start/end dates if a preset is chosen
                params.delete('start_date');
                params.delete('end_date');
            }

            try {
                const response = await fetch(`/api/reports?${params.toString()}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const reportData = await response.json();
                displayReport(reportData);
            } catch (error) {
                console.error('Error fetching report:', error);
                reportResultsContainer.innerHTML = `<p class="text-danger">Failed to load report: ${error.message}</p>`;
            }
        }

        // Function to display report data in a table
        function displayReport(data) {
            if (data.length === 0) {
                reportResultsContainer.innerHTML = '<p class="text-muted">No data found for the selected criteria.</p>';
                return;
            }

            let tableHtml = '<table class="table table-striped table-hover"><thead><tr><th>Category</th><th>Total Duration</th></tr></thead><tbody>';
            data.forEach(row => {
                // Format duration from seconds to a human-readable string
                const totalDurationSeconds = row.total_duration;
                const hours = Math.floor(totalDurationSeconds / 3600);
                const minutes = Math.floor((totalDurationSeconds % 3600) / 60);
                const seconds = Math.floor(totalDurationSeconds % 60);
                const formattedDuration = `${hours}h ${minutes}m ${seconds}s`;

                tableHtml += `<tr><td>${row.group_key}</td><td>${formattedDuration}</td></tr>`;
            });
            tableHtml += '</tbody></table>';
            reportResultsContainer.innerHTML = tableHtml;
        }

        // Attach form submit listener
        form.addEventListener('submit', generateReport);

        // Initial report generation on page load (optional, but good for first view)
        // generateReport({ preventDefault: () => {} }); // Simulate event object
    });
</script>
{% endblock %}
